name: Ci

on:
  pull_request:



permissions:
 actions: read
 contents: read


jobs:

  list_runners:
    runs-on: ubuntu-latest
    steps:
      - name: List runners
        run: |
          echo "Available runners:"
          curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
           -H "Accept: application/vnd.github+json" \
           https://api.github.com/repos/OWNER/REPO/actions/runners \
          | jq '.runners[] | select(.labels[].name == "pldm") | {id, name, status, labels}'

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 


  setup:
    runs-on: pldm
    strategy:
      matrix:
        dummy: [dummy1, dummy2]
    outputs:
      runner_name: ${{ runner.name }}
    steps:
      - name: Print runner name
        run: echo Set up runner ${{ runner.name }}, with dummy ${{ matrix.dummy }}


  test:
    runs-on: ${{ needs.setup.outputs.runner_name }}
    needs: setup
    strategy:
      matrix:
        dummy: [dummy1, dummy2]
    steps:
      - name: Print runner name
        run: echo "Running on ${{ runner.name }}, with dummy ${{ matrix.dummy }}"
